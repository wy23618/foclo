server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 121.199.74.171;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/yotick-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
