server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 121.199.74.171;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/yotick-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 121.199.74.171;

    ssl_certificate /etc/letsencrypt/live/121.199.74.171/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/121.199.74.171/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:yotick_tls:10m;
    ssl_session_timeout 10m;
    server_tokens off;

    location = /api/v1 {
        return 308 https://$server_name/api/v1/;
    }

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    location / {
        return 404;
    }
}
