# Suggested starting point for a 2 GiB single-purpose VM. Review against the
# existing PostgreSQL configuration before applying; these are not commands.
listen_addresses = '127.0.0.1'
max_connections = 30
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 64MB
wal_buffers = 16MB
checkpoint_completion_target = 0.9

# Configure TLS using a CA-signed server certificate whose subjectAltName
# includes IP:127.0.0.1. Install the CA at /etc/yotick/postgres-ca.crt for
# NODE_EXTRA_CA_CERTS; do not assume Node.js uses the OS trust store by default.
# Set ssl=on and point ssl_cert_file / ssl_key_file to protected files in the
# PostgreSQL configuration. Keep private key readable only by postgres.
# In pg_hba.conf allow hostssl connections from 127.0.0.1/32 with scram-sha-256
# and reject hostnossl connections from 127.0.0.1/32.
