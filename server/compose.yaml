services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: yotick
      POSTGRES_USER: yotick_migrator
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["yotick_database:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yotick_migrator -d yotick"]
      interval: 5s
      timeout: 3s
      retries: 10
secrets:
  postgres_password:
    file: ./local-postgres-password.txt
volumes:
  yotick_database:
